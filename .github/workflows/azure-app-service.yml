name: CI/CD deploy to Azure App Service

# Trigger workflow manually or automatically on push to main branch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the JWT token (OIDC) to authenticate securely with Azure
      contents: read # Required for actions/checkout to read the repository content

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Generate Prisma client
      # This is critical before building Next.js since Next.js pages/endpoints compile against the Prisma Client
      - name: Prisma Generate
        run: npx prisma generate

      # 5. Build Next.js application
      - name: Build Next.js app
        run: npm run build

      # 6. Login to Azure using OIDC (OpenID Connect)
      # This is the modern, passwordless way to log in without storing long-lived secret credentials
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 7. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "Saas-Cloudanary"
          slot-name: "Production"
          package: . # Deploys the built workspace (includes .next, node_modules, package.json, etc.)
