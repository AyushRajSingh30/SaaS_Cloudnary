name: CI/CD deploy to Azure App Service

# Trigger workflow manually or automatically on push to main branch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Build the application
  # ==========================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Generate Prisma client
      # This is critical before building Next.js since Next.js pages/endpoints compile against the Prisma Client
      - name: Prisma Generate
        run: npx prisma generate

      # 5. Build Next.js application
      - name: Build Next.js app
        run: npm run build

      # 6. Upload built artifacts
      # We upload the entire workspace (including .next, node_modules, and prisma client) 
      # so the deployment job can access them.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: .
          retention-days: 1 # Delete the temp build artifact after 1 day to save storage

  # ==========================================
  # JOB 2: Deploy to Azure App Service
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build # Tells GitHub Actions to wait for the 'build' job to succeed first
    permissions:
      id-token: write # Required for requesting the JWT token (OIDC) to authenticate securely with Azure
      contents: read  # Required for actions/checkout to read repository content

    steps:
      # 1. Download the build artifact
      # This fetches the built files uploaded by the 'build' job and places them in the current directory
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      # 2. Login to Azure using OIDC (OpenID Connect)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'b2bagent'
          slot-name: 'Production'
          package: . # Deploys the downloaded built files
